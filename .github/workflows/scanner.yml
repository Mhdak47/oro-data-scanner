name: Oro & Data Scanner (Jamal Flow)

on:
  schedule:
    - cron: '*/30 * * * *'   # Exécute toutes les 30 minutes
  workflow_dispatch:         # Permet de lancer manuellement si tu veux tester

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4
      
    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Installer les bibliothèques
      run: pip install yfinance pandas numpy requests
      
    - name: Lancer le scan des marchés
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python oro_data_cron.py
